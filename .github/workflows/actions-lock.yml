name: Actions lock

# Verifies the action lockfile (.github/workflows/actions.lock, gh actions-lock) against the
# workflows. It is its own workflow on purpose: a lock failure must not block a release gate
# that calls one of the other workflows.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension list | grep -q gh-actions-lock || gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify the actions lock
        run: gh actions-lock --verify
