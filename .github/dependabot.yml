version: 2

# Keeps every ecosystem in this repo up to date. Updates land on `main` automatically
# (see .github/workflows/dependabot-auto-merge.yml); release-please remains the gate for
# actually cutting a release. Dep bumps use the `fix(deps)` type, so each merged bump ships
# as a patch release.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(deps)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(deps)
    groups:
      composer:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /tests/tools
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(deps)
    groups:
      composer-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(deps)
    groups:
      npm:
        patterns: ["*"]
